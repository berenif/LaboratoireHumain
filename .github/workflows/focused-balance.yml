name: Focused balance verification

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/character/**"
      - "tests/balance-controller.test.mjs"
      - "tests/recovery-*.test.mjs"
      - "scripts/probe-balance-fall-transition.mjs"
      - ".github/workflows/focused-balance.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Probe first balance-to-recovery transition
        run: node scripts/probe-balance-fall-transition.mjs
      - run: node --test tests/balance-controller.test.mjs
      - run: npm run test:recovery
