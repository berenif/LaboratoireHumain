name: Focused balance verification

on:
  push:
    branches:
      - agent/step-yaw-follow

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/balance-controller.test.mjs
      - run: npm run test:recovery
