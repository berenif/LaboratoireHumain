name: Persist diagnostic type import
on:
  push:
    branches: [agent/physical-chain-frame-repair]
    paths: [.github/workflows/persist-chain-typefix.yml]
permissions:
  contents: write
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Commit only the verified source import, without workflow changes
        run: |
          test "$(git rev-parse HEAD^)" = 99c74f4906162fcac15404b33d3dcb1ce3aff62a
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('src/character/EmbodiedCharacter.ts')
          source = p.read_bytes()
          assert hashlib.sha256(source).hexdigest() == '74785e7b5a2ae62299dd1a3cdb0a8c9c071d776aee81891cdb9c349151076b1a'
          old = b'  SegmentId,\n  SupportState,'
          assert source.count(old) == 1
          source = source.replace(old, b'  SegmentId,\n  SegmentPose,\n  SupportState,')
          assert hashlib.sha256(source).hexdigest() == '74d3ade5702c36a566e6e0abde42e49b8877c2521a32ea21cf0160f0220bf792'
          p.write_bytes(source)
          PY
          git add src/character/EmbodiedCharacter.ts
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: import the standing diagnostic pelvis pose type'
          git push origin HEAD:refs/heads/agent/physical-chain-frame-repair
          git rev-parse HEAD
