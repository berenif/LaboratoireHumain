name: Exact b0d1e83 repair workspace
on:
  push:
    branches: [agent/fix-b0d1e83-physics]
    paths: [.github/workflows/fix-b0d1e83-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export unmodified Git history
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git rev-parse b0d1e83f27c0fa6a70b26aa8c1ae7fb112d03185^{tree} > "$RUNNER_TEMP/base-tree.txt"
          git bundle create "$RUNNER_TEMP/exact-repository.bundle" --all
      - uses: actions/upload-artifact@v4
        with:
          name: exact-b0d1e83-repair-workspace
          path: |
            ${{ runner.temp }}/exact-repository.bundle
            ${{ runner.temp }}/source-commit.txt
            ${{ runner.temp }}/base-tree.txt
          retention-days: 3
