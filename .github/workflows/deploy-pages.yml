name: Promote accepted Rust Pages artifact

on:
  workflow_dispatch:
    inputs:
      accepted_run_id:
        description: Windows qualification run containing accepted-rust-pages
        required: true
        type: string
      rollback_run_id:
        description: Run containing the qualified rollback bundle
        required: true
        type: string
      rollback_runtime:
        description: Use typescript for the first migration, rust for later releases
        required: true
        default: typescript
        type: choice
        options:
          - typescript
          - rust

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  promote:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Windows, X64, lh-frozen-hardware]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: accepted-rust-pages
          run-id: ${{ inputs.accepted_run_id }}
          github-token: ${{ github.token }}
          path: evidence/promotion-candidate
      - uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.rollback_runtime == 'typescript' && 'qualified-typescript-rollback' || 'accepted-rust-pages' }}
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ github.token }}
          path: evidence/promotion-previous
      - name: Validate candidate and rollback bytes before deployment
        run: |
          node scripts/promote-rust-pages.mjs evidence/promotion-candidate evidence/promoted-site
          node scripts/promote-pages-rollback.mjs evidence/promotion-previous evidence/rollback-site "$env:ROLLBACK_RUNTIME"
        env:
          ROLLBACK_RUNTIME: ${{ inputs.rollback_runtime }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: evidence/promoted-site
          name: github-pages
      - name: Promote exact accepted bytes
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Check published hashes, worker, modes and renderers
        id: published
        continue-on-error: true
        run: node scripts/verify-rust-published.mjs evidence/published-checks "$env:PUBLISHED_URL" evidence/promotion-candidate
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
          RUST_BROWSER_CHANNEL: msedge
      - name: Upload previous verified bytes for rollback
        if: steps.published.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: evidence/rollback-site
          name: rollback-pages
      - name: Restore previous verified Pages artifact
        id: rollback
        if: steps.published.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: rollback-pages
      - name: Verify restored artifact
        if: steps.published.outcome == 'failure'
        run: node scripts/verify-pages-rollback.mjs evidence/rollback-checks "$env:PUBLISHED_URL" evidence/promotion-previous "$env:ROLLBACK_RUNTIME"
        env:
          PUBLISHED_URL: ${{ steps.rollback.outputs.page_url }}
          ROLLBACK_RUNTIME: ${{ inputs.rollback_runtime }}
          RUST_BROWSER_CHANNEL: msedge
      - name: Preserve promotion and rollback checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-promotion-receipts
          path: |
            evidence/published-checks
            evidence/rollback-checks
      - name: Reject unsuccessful publication
        if: steps.published.outcome == 'failure'
        run: exit 1
