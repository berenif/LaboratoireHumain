name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static site
        run: npm run build:pages
        env:
          NEXT_TELEMETRY_DISABLED: 1
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify static site
        run: npm run verify:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Typecheck application
        run: npm run typecheck

      - name: Verify recovery regressions
        run: npm run test:recovery

      - name: Verify balance regressions
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/physics-commit.txt
          node --test tests/balance-controller.test.mjs tests/balance-probe-diagnostics.test.mjs tests/landing-plan.test.mjs tests/leg-target-dynamics.test.mjs 2>&1 | tee evidence/balance-ci.log

      - name: Verify physics acceptance
        timeout-minutes: 45
        shell: bash
        run: npm run test:physics 2>&1 | tee evidence/physics-ci.log
        env:
          PHYSICS_WORKERS: '2'
          PHYSICS_PROGRESS: '1'

      - name: Upload physics verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-acceptance-${{ github.run_attempt }}
          path: |
            evidence/physics-commit.txt
            evidence/balance-ci.log
            evidence/physics-ci.log
            evidence/physics-results.json
            evidence/physics-execution.json
            evidence/physics-workers/**/*-results.json
            evidence/physics-workers/**/*-console.txt
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
