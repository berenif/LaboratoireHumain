name: MuJoCo static package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check paths, asset hashes and frozen policy fixtures without integration
        run: node scripts/verify-mujoco-package.mjs
      # No simulation, SDK installation, Pages publication or media transfer.
      # Legacy Rust qualification workflows remain manual and unchanged.
