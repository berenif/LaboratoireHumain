name: Physical coherence continuation

on:
  push:
    branches: [fix/physical-coherence-continuation]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/coherence-continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coherence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Preserve exact source and locked build dependencies
        shell: bash
        run: |
          mkdir -p evidence/continuation
          git rev-parse HEAD > evidence/continuation/source-commit.txt
          sha256sum package-lock.json > evidence/continuation/lock.sha256
          tar --exclude=./node_modules --exclude=./.next --exclude=./dist --exclude=./.sites-runtime --exclude=./evidence -czf /tmp/continuation-source.tar.gz .
          tar -czf /tmp/continuation-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-exact-workspace
          path: /tmp/continuation-*.tar.gz
          retention-days: 3
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Full unit and application build
        run: npm test 2>&1 | tee evidence/continuation/unit.log
      - name: Recovery regression
        if: always()
        run: npm run test:recovery 2>&1 | tee evidence/continuation/recovery.log
      - name: Physics release harness
        if: always()
        run: timeout 240s npm run test:physics 2>&1 | tee evidence/continuation/physics.log
      - name: Static Pages export
        if: always()
        run: npm run test:pages 2>&1 | tee evidence/continuation/pages.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-verification
          path: evidence/continuation/
          retention-days: 7
