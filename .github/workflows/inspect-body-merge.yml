name: Inspect concurrent body checkpoint merge
on:
  push:
    branches: [ops/publish-body-coherence-58f4183]
    paths: [.github/workflows/inspect-body-merge.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export concurrent history and inspect three-way merge without publishing changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/body-merge-review
          base=06c53a933c637c2425888558ae788f4f99d40f58
          main=d670e755303fbaead6112c3e5bf6c93592951212
          saved=58f4183ad19ea9d010af77cd4cdecde012d4ea73
          test "$(git rev-parse origin/main)" = "$main"
          git bundle create /tmp/body-merge-review/concurrent-main.bundle refs/remotes/origin/main "^$base"
          git diff --stat "$base" "$main" > /tmp/body-merge-review/main-changes.txt
          set +e
          git merge-tree --write-tree --messages "$saved" "$main" > /tmp/body-merge-review/merge-tree.txt
          result=$?
          set -e
          printf '%s\n' "$result" > /tmp/body-merge-review/merge-tree.exit
          cat /tmp/body-merge-review/merge-tree.txt
          test "$result" -le 1
      - uses: actions/upload-artifact@v4
        with:
          name: concurrent-body-merge-review
          path: /tmp/body-merge-review/
          retention-days: 3
