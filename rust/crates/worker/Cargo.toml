[package]
name = "lh-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
getup-policy-adaptation-experiment = ["lh-sim/getup-policy-adaptation-experiment"]
root-translation-carry-experiment = ["lh-sim/root-translation-carry-experiment"]
getup-terminal-tail-observer-experiment = ["lh-sim/getup-terminal-tail-observer-experiment"]
getup-physical-roll-experiment = ["lh-sim/getup-physical-roll-experiment"]
getup-supported-transfer-experiment = ["lh-sim/getup-supported-transfer-experiment"]
getup-native-locomotion-experiment = ["lh-sim/getup-native-locomotion-experiment"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lh-model.workspace = true
lh-contracts.workspace = true
lh-sim.workspace = true
serde_json.workspace = true
serde.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
