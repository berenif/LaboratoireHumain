[package]
name = "lh-sim"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
getup-policy-adaptation-experiment = []
stationary-balance-experiment = []
standing-dynamics-experiment = []
getup-terminal-balance-experiment = []
getup-repeat-cycle-experiment = ["getup-terminal-balance-experiment"]
# Explicit default-off control admission; final physical acceptance is unchanged.
getup-repeat-balance-acquire-experiment = ["getup-repeat-cycle-experiment", "getup-terminal-bumpless-experiment"]
getup-supported-transfer-experiment = ["getup-repeat-balance-acquire-experiment", "standing-dynamics-experiment"]
getup-native-locomotion-experiment = ["getup-repeat-balance-acquire-experiment", "standing-dynamics-experiment"]
getup-physical-roll-experiment = ["getup-repeat-cycle-experiment"]
# Isolated, default-off immutable native observation. No persistent selector.
getup-terminal-tail-observer-experiment = []
getup-terminal-base-ready-experiment = ["getup-terminal-balance-experiment"]
getup-terminal-bumpless-experiment = ["getup-terminal-base-ready-experiment"]
experimental-solver-step-observation = ["rapier3d/solver-step-observation"]
experimental-joint-velocity-cache = ["rapier3d/experimental-joint-velocity-cache"]
experimental-simd8 = ["rapier3d/simd8"]
root-translation-carry-experiment = ["rapier3d/compensated-root-integration"]
unit-root-rotation-experiment = ["rapier3d/unit-root-rotation"]
coordination-worker = ["experimental-solver-step-observation"]
coordination-transfer-worker = ["coordination-worker"]
numeric-parity-worker = ["experimental-solver-step-observation"]

[[example]]
name = "getup_stationary_balance"
required-features = ["stationary-balance-experiment"]

[[example]]
name = "contact_interval_probe"
required-features = ["experimental-solver-step-observation"]

[[example]]
name = "getup_dynamic_balance"
required-features = ["standing-dynamics-experiment"]

[[example]]
name = "getup_dynamic_quiet"
required-features = ["standing-dynamics-experiment"]

[[example]]
name = "getup_terminal_recovery"
required-features = ["getup-terminal-balance-experiment"]

[[example]]
name = "getup_roll_inspect"
required-features = ["getup-terminal-tail-observer-experiment", "getup-physical-roll-experiment", "root-translation-carry-experiment", "unit-root-rotation-experiment"]

[[test]]
name = "coordination-transfer-worker"
path = "src/lib.rs"
harness = false
required-features = ["coordination-transfer-worker"]

[[test]]
name = "numeric-parity-worker-serialization"
path = "src/lib.rs"
harness = false
required-features = ["numeric-parity-worker"]

[[test]]
name = "numeric-parity-worker"
path = "src/lib.rs"
harness = false
required-features = ["numeric-parity-worker"]

[[test]]
name = "coordination-local-pair-worker"
path = "src/lib.rs"
harness = false
required-features = ["coordination-worker"]

[[test]]
name = "coordination-worker"
path = "src/lib.rs"
harness = false
required-features = ["coordination-worker"]

[dependencies]
rapier3d.workspace = true
lh-model.workspace = true
lh-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode = "=1.3.3"
